datasets:
  vla_data:
    action_horizon: 30
    data_mix: wipes_alicia_q99
    data_root_dir: playground/Datasets/WIPES_ALICIA
    dataset_py: lerobot_datasets
    lerobot_version: v3.0
    num_workers: 4
    obs_image_size:
    - 224
    - 224
    per_device_batch_size: 1
    persistent_workers: true
    pin_memory: true
    prefetch_factor: 2
    video_backend: pyav
framework:
  action_model:
    action_dim: 7
    action_horizon: 30
    action_model_type: DiT-B
    add_pos_embed: true
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null
    hidden_size: 1024
    max_seq_len: 1024
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_inference_timesteps: 10
    num_target_vision_tokens: 32
    num_timestep_buckets: 1000
    repeated_diffusion_steps: 10
    state_dim: 7
  name: QwenGR00T
  qwenvl:
    attn_implementation: sdpa
    base_vlm: /media/yunyi/Data/Desktop/work/vla/starVLA/playground/Pretrained_models/Qwen3.5-2B
output_dir: playground/Checkpoints/wipes_qwen3_5_2b_gr00t_freeze_vit
run_id: wipes_qwen3_5_2b_gr00t_freeze_vit
run_root_dir: playground/Checkpoints
seed: 42
trainer:
  eval_interval: 200
  freeze_modules: qwen_vl_interface.model.model.visual
  gradient_accumulation_steps: 32
  gradient_checkpointing: true
  gradient_clipping: 1.0
  learning_rate:
    action_model: 0.0001
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
  logging_frequency: 10
  lr_scheduler_type: cosine_with_min_lr
  max_train_steps: 10000
  num_warmup_steps: 500
  optimizer:
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
  save_interval: 2000
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
wandb_entity: yunyi_
wandb_project: wipes_alicia
